services:
  - type: web
    name: ai-invoice-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: invoice-images
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL: https://your-app.vercel.app
      - key: JWT_SECRET_KEY
        generateValue: true
